# Builds the Zynky Android companion APK on GitHub's servers, so no Android
# SDK, NDK or Android Studio is needed on your own machine.
#
# Download the result from the run's "Artifacts" section (zynky-android).
name: Android APK

on:
  push:
    branches:
      - main
      - claude/zynky-credential-manager-5hea2s
    paths-ignore:
      - "**.md"
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      NDK_VERSION: "27.2.12479018"
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      # GitHub's Ubuntu runners ship the Android SDK at $ANDROID_HOME; only the
      # NDK needs adding.
      - name: Install Android NDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" --install "ndk;${NDK_VERSION}" > /dev/null
          ls "$ANDROID_HOME/ndk"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install npm dependencies
        run: npm ci

      # A debug build is signed automatically, so the APK installs directly.
      # Only 64-bit ARM is built: that covers every phone from the last ~8 years.
      - name: Build APK
        run: |
          export NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          npx tauri android build --apk --target aarch64 --debug

      - name: Collect APK
        run: |
          mkdir -p out
          find src-tauri/gen/android/app/build/outputs/apk -name '*.apk' -exec cp {} out/ \;
          cd out && for f in *.apk; do mv "$f" "zynky-${GITHUB_SHA::7}.apk"; break; done
          ls -la

      - uses: actions/upload-artifact@v4
        with:
          name: zynky-android
          path: out/*.apk
          if-no-files-found: error
