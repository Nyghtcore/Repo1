[package]
name = "zynky"
version = "0.1.0"
description = "Zynky - local-first, serverless credential, document and task manager"
authors = ["Zynky contributors"]
edition = "2021"
rust-version = "1.80"

[lib]
# The `_lib` suffix keeps the library name unique so it does not collide with
# the binary name on Windows (https://github.com/rust-lang/cargo/issues/8519).
name = "zynky_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri runtime + official plugins
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"

# Cryptography
argon2 = { version = "0.5", features = ["std"] }
aes-gcm = { version = "0.10", features = ["std"] }
rand = "0.8"
base64 = "0.22"
zeroize = { version = "1", features = ["zeroize_derive"] }

# Time handling for reminders
chrono = { version = "0.4", features = ["serde", "clock"] }

# Filesystem change tracking (Syncthing drops files in from other peers)
notify = "8"

# Error handling
thiserror = "2"
log = "0.4"
env_logger = "0.11"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
